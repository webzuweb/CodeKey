name: codekey_app
description: Cross-platform Android and iOS controller for the CodeKey ESP32-S3 USB HID keyboard bridge.
publish_to: none
version: 0.3.2+5

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cross_file: ^0.3.5+5
  crypto: ^3.0.7
  flutter_reactive_ble: ^5.5.0
  flutter_secure_storage: ^11.0.0
  google_mlkit_text_recognition: 0.15.1
  http: ^1.6.0
  camera: ^0.12.0+2
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
